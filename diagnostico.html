<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico PCA gratis · Talento Impulsa Consulting</title>
<meta name="description" content="Descubrí en minutos dónde estás perdiendo tiempo y qué pack de Talento Impulsa te conviene, con nuestro diagnóstico conversacional PCA™.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#9A7B3D;
  --gold-soft:#B8995A;
  --gold-deep:#75582A;
  --gold-luminous:#D4B062;
  --cream:#EFE9DB;
  --card:#FFFFFF;
  --border:#C8C0B5;
  --text:#1A1814;
  --text-dim:#6E6859;
  --font-body:'Outfit',sans-serif;
  --font-italic:'Cormorant Garamond',serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{
  /* evita el "rebote" horizontal en iOS si algo se pasa por unos px */
  overflow-x:hidden;
}
body{
  font-family:var(--font-body);
  font-weight:300;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh; /* alto real de viewport en mobile, sin la barra del navegador */
  width:100%;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 16px 60px;
}
a{color:inherit}

.top-link{
  align-self:flex-start;
  margin-bottom:22px;
  font-size:14px;
  color:var(--text-dim);
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:6px;
}
.top-link:hover{color:var(--gold-deep)}

.header{
  text-align:center;
  max-width:560px;
  margin-bottom:28px;
}
.header h1{
  font-family:var(--font-italic);
  font-style:italic;
  font-weight:600;
  font-size:32px;
  color:var(--gold-deep);
  margin-bottom:10px;
}
.header p{
  font-size:15px;
  color:var(--text-dim);
  line-height:1.6;
}

.progress-wrap{
  width:100%;
  max-width:560px;
  margin-bottom:14px;
}
.progress-track{
  height:4px;
  background:var(--border);
  border-radius:99px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--gold-luminous);
  border-radius:99px;
  transition:width .4s var(--ease);
  width:0%;
}
.progress-label{
  font-size:11.5px;
  color:var(--text-dim);
  margin-top:6px;
  text-align:right;
}

.chat-card{
  width:100%;
  max-width:560px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 12px 40px rgba(26,24,20,.08);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.messages{
  flex:1;
  min-height:320px;
  max-height:52vh;
  overflow-y:auto;
  padding:22px 20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

.msg{
  max-width:82%;
  padding:11px 15px;
  border-radius:14px;
  font-size:14.5px;
  line-height:1.55;
  white-space:pre-line;
}
.msg.bot{
  align-self:flex-start;
  background:var(--cream);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
  color:var(--text);
}
.msg.user{
  align-self:flex-end;
  background:var(--gold-deep);
  color:#fff;
  border-bottom-right-radius:4px;
}
.msg.typing{
  align-self:flex-start;
  background:var(--cream);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
  color:var(--text-dim);
  font-style:italic;
}

.input-row{
  display:flex;
  gap:10px;
  padding:14px 16px;
  border-top:1px solid var(--border);
  background:var(--card);
}
.input-row input{
  flex:1;
  min-width:0; /* si no, un input dentro de flex puede forzar overflow horizontal */
  padding:11px 14px;
  border-radius:10px;
  border:1.5px solid var(--border);
  font-family:var(--font-body);
  /* 16px es el mínimo para que iOS Safari NO haga auto-zoom al enfocar el campo
     (con menos de 16px, el navegador "acerca" la página entera y todo se ve
     descuadrado hasta que se saca el foco) */
  font-size:16px;
  color:var(--text);
}
.input-row input:focus{
  outline:none;
  border-color:var(--gold-soft);
  box-shadow:0 0 0 3px rgba(154,123,61,.14);
}
.input-row button{
  padding:0 20px;
  border:none;
  border-radius:10px;
  background:var(--gold-deep);
  color:#fff;
  font-family:var(--font-body);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  transition:opacity .2s var(--ease);
}
.input-row button:disabled{opacity:.5;cursor:default}
.input-row button:not(:disabled):hover{opacity:.88}

.error-banner{
  padding:11px 16px;
  background:#FBEAEA;
  color:#9C3B3B;
  font-size:13px;
  text-align:center;
  border-top:1px solid #E8C7C7;
}

/* ---- resultado final ---- */
.result{
  width:100%;
  max-width:560px;
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.result-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px 24px;
}
.result-card h2{
  font-family:var(--font-italic);
  font-style:italic;
  font-weight:600;
  font-size:20px;
  color:var(--gold-deep);
  margin-bottom:12px;
}
.bottleneck{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-top:1px solid var(--border);
}
.bottleneck:first-of-type{border-top:none}
.bottleneck .icon{font-size:20px}
.bottleneck .label{font-weight:600;font-size:13.5px;margin-bottom:3px}
.bottleneck .text{font-size:13px;color:var(--text-dim);line-height:1.55}

.pack-card{
  background:linear-gradient(135deg,var(--gold-deep),var(--gold));
  color:#fff;
  border-radius:16px;
  padding:26px 24px;
}
.pack-card .tag{
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.85;
  margin-bottom:6px;
}
.pack-card h2{
  font-family:var(--font-italic);
  font-style:italic;
  font-weight:600;
  font-size:24px;
  margin-bottom:10px;
}
.pack-card p{
  font-size:14px;
  line-height:1.65;
  opacity:.95;
}

.cta-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:6px;
}
.cta-btn{
  padding:13px 28px;
  border-radius:11px;
  font-size:14.5px;
  font-weight:600;
  text-decoration:none;
  transition:opacity .2s var(--ease), transform .2s var(--ease);
}
/* ---- formulario previo (nombre + mail) y paso de teléfono final ---- */
.lead-form{
  width:100%;
  max-width:560px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 12px 40px rgba(26,24,20,.08);
  padding:26px 24px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.lead-form label{
  font-size:13px;
  color:var(--text-dim);
  display:flex;
  flex-direction:column;
  gap:6px;
}
.lead-form input{
  padding:11px 14px;
  border-radius:10px;
  border:1.5px solid var(--border);
  font-family:var(--font-body);
  font-size:16px; /* ver nota arriba sobre auto-zoom de iOS */
  color:var(--text);
}
.lead-form input:focus{
  outline:none;
  border-color:var(--gold-soft);
  box-shadow:0 0 0 3px rgba(154,123,61,.14);
}
.lead-form .hint{font-size:12px;color:var(--text-dim)}
.lead-form button{
  margin-top:4px;
  padding:13px 20px;
  border:none;
  border-radius:10px;
  background:var(--gold-deep);
  color:#fff;
  font-family:var(--font-body);
  font-weight:600;
  font-size:14.5px;
  cursor:pointer;
  transition:opacity .2s var(--ease);
}
.lead-form button:disabled{opacity:.5;cursor:default}
.lead-form button:not(:disabled):hover{opacity:.88}
.lead-form .field-error{font-size:12px;color:#9C3B3B;display:none}

.phone-step{
  width:100%;
  max-width:560px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:12px;
  text-align:center;
}
.phone-step p{font-size:14px;color:var(--text-dim)}
.phone-step .phone-row{display:flex;gap:10px}
.phone-step input{
  flex:1;
  padding:11px 14px;
  border-radius:10px;
  border:1.5px solid var(--border);
  font-family:var(--font-body);
  font-size:16px;
  color:var(--text);
}
.phone-step .actions{display:flex;gap:10px;justify-content:center;margin-top:4px}
.phone-step button{
  padding:12px 22px;
  border-radius:10px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  border:none;
  transition:opacity .2s var(--ease);
}
.phone-step button.primary{background:var(--gold-deep);color:#fff}
.phone-step button.secondary{background:transparent;color:var(--text-dim);border:1.5px solid var(--border)}
.phone-step button:hover{opacity:.88}

.cta-btn.primary{background:var(--gold-deep);color:#fff}
.cta-btn.secondary{background:transparent;color:var(--gold-deep);border:1.5px solid var(--border)}
.cta-btn:hover{opacity:.88;transform:translateY(-1px)}

/* ---- ajustes para celulares (además de las reglas fluidas de arriba,
   que ya usan max-width:560px + 100% + padding del body) ---- */
@media (max-width:480px){
  body{padding:20px 12px 40px}
  .header{margin-bottom:20px}
  .header h1{font-size:26px}
  .header p{font-size:13.5px}
  .messages{padding:16px 14px;min-height:280px;max-height:58vh;max-height:58dvh}
  .msg{max-width:88%;font-size:14px;padding:10px 13px}
  .input-row{padding:10px 12px;gap:8px}
  .input-row button{padding:0 16px;font-size:13.5px}
  .result-card{padding:18px 16px}
  .pack-card{padding:20px 18px}
  .cta-btn{padding:12px 20px;font-size:13.5px;flex:1 1 auto;text-align:center}
}
</style>
</head>
<body>

<a href="index.html" class="top-link">← Volver al sitio</a>

<div class="header">
  <h1>Diagnóstico PCA™</h1>
  <p>Una charla de unos minutos con nuestra asistente para identificar dónde estás perdiendo más tiempo, y qué pack de Talento Impulsa te conviene.</p>
</div>

<form class="lead-form" id="lead-form">
  <label>
    Nombre
    <input type="text" id="lead-nombre" placeholder="¿Cómo te llamás?" autocomplete="name" required>
  </label>
  <label>
    Mail
    <input type="email" id="lead-email" placeholder="tu@mail.com" autocomplete="email" required>
    <span class="hint">Te vamos a mandar el resultado completo a este mail.</span>
  </label>
  <span class="field-error" id="lead-error"></span>
  <button type="submit" id="lead-submit">Empezar el diagnóstico</button>
</form>

<div class="progress-wrap" id="progress-wrap" style="display:none">
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="progress-label" id="progress-label"></div>
</div>

<div class="chat-card" id="chat-card" style="display:none">
  <div class="messages" id="messages"></div>
  <div class="input-row" id="input-row">
    <input type="text" id="input" placeholder="Escribí tu respuesta..." autocomplete="off">
    <button id="send-btn">Enviar</button>
  </div>
</div>

<div class="phone-step" id="phone-step" style="display:none">
  <p>Última cosa antes de mostrarte el resultado: dejanos un teléfono por si querés que te contactemos.</p>
  <div class="phone-row">
    <input type="tel" id="phone-input" placeholder="Ej: 11 2345 6789" autocomplete="tel">
  </div>
  <div class="actions">
    <button type="button" class="secondary" id="phone-skip">Omitir</button>
    <button type="button" class="primary" id="phone-submit">Ver mi resultado</button>
  </div>
</div>

<div class="result" id="result" style="display:none"></div>

<script>
const BASE_URL = "https://pca-diagnostico-api.onrender.com";
const API_URL = BASE_URL + "/chat";
const COMPLETAR_LEAD_URL = BASE_URL + "/completar-lead";

// La sesión vive solo en memoria mientras dura esta visita a la página.
// Si el visitante refresca a mitad de la entrevista, arranca de nuevo:
// la API exige un "mensaje" no vacío para continuar una sesión existente,
// así que no hay forma de "retomar" sin repreguntar desde el inicio.
let sessionId = null;
let entrevistaIniciada = false; // true recién cuando llega la primera pregunta
                                 // del bot con éxito — distinto de "sessionId
                                 // no nulo", porque ahora guardamos el
                                 // session_id incluso en un intento fallido
                                 // (ver por qué en callChat)
let resultadoPendiente = null; // guardamos el resultado ni bien llega, para
                                // mostrarlo recién después del paso de teléfono
let datosContacto = null;      // {nombre, email} — se guarda acá ni bien se
                                // manda el formulario, y se reenvía en CADA
                                // request hasta que haya session_id. Así, si
                                // el primer pedido falla (servidor "dormido"
                                // por inactividad, hipo de Groq, etc.), un
                                // reintento simplemente vuelve a mandar los
                                // mismos datos en vez de perderlos.

const leadForm = document.getElementById("lead-form");
const leadNombre = document.getElementById("lead-nombre");
const leadEmail = document.getElementById("lead-email");
const leadError = document.getElementById("lead-error");
const leadSubmit = document.getElementById("lead-submit");

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const inputRow = document.getElementById("input-row");
const chatCard = document.getElementById("chat-card");
const resultEl = document.getElementById("result");
const progressWrap = document.getElementById("progress-wrap");
const progressFill = document.getElementById("progress-fill");
const progressLabel = document.getElementById("progress-label");
const phoneStep = document.getElementById("phone-step");
const phoneInput = document.getElementById("phone-input");
const phoneSubmit = document.getElementById("phone-submit");
const phoneSkip = document.getElementById("phone-skip");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showTyping(texto) {
  hideTyping(); // por si quedó uno colgado de un intento anterior (evita que se acumulen)
  const div = document.createElement("div");
  div.className = "msg typing";
  div.textContent = texto || "escribiendo...";
  div.id = "typing-indicator";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function showError(text) {
  let banner = document.getElementById("error-banner");
  if (!banner) {
    banner = document.createElement("div");
    banner.className = "error-banner";
    banner.id = "error-banner";
    chatCard.appendChild(banner);
  }
  banner.textContent = text;
}

function clearError() {
  const banner = document.getElementById("error-banner");
  if (banner) banner.remove();
}

function setBusy(busy) {
  inputEl.disabled = busy;
  sendBtn.disabled = busy;
}

async function callChat(mensaje, intento) {
  intento = intento || 1;
  const esInicio = !entrevistaIniciada;

  clearError();
  setBusy(true);
  showTyping(esInicio ? "arrancando la entrevista..." : null);

  const body = { session_id: sessionId, mensaje: mensaje || null };
  if (esInicio && datosContacto) {
    body.nombre = datosContacto.nombre;
    body.email = datosContacto.email;
  }

  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();

    // Capturamos el session_id aunque el pedido haya fallado: el backend ya
    // creó la sesión y registró el lead en Sheets ANTES de intentar hablar
    // con el modelo, así que si perdemos ese id acá, el próximo reintento
    // (automático o manual) generaría una sesión Y un lead nuevos —
    // duplicando la fila en Sheets en cada fallo. Guardándolo, el reintento
    // sigue la MISMA sesión (y el backend sabe reintentar sin pedir un
    // 'mensaje' nuevo cuando la entrevista todavía no arrancó de verdad).
    if (data.session_id) sessionId = data.session_id;

    if (!resp.ok) {
      // Solo reintentamos automáticamente mientras la entrevista no arrancó
      // de verdad (no llegó la primera pregunta del bot): es el tramo que
      // más sufre si el servidor gratuito de Render estaba "dormido" por
      // inactividad o Groq tuvo un hipo momentáneo. Una vez arrancada, un
      // error se muestra directo — no tiene sentido reintentar solo una
      // respuesta puntual del usuario.
      if (esInicio && intento < 3) {
        setTimeout(() => callChat(mensaje, intento + 1), 4000);
        return;
      }
      hideTyping();
      showError(data.error || "Ocurrió un error, intentá de nuevo en unos segundos.");
      setBusy(false);
      return;
    }

    hideTyping();
    entrevistaIniciada = true;

    addMessage(data.mensaje, "bot");

    if (data.terminado) {
      resultadoPendiente = data.resultado;
      mostrarPasoTelefono();
      return;
    }

    if (data.progreso) {
      progressWrap.style.display = "block";
      const pct = (data.progreso.respondidas / data.progreso.total) * 100;
      progressFill.style.width = pct + "%";
      progressLabel.textContent = `${data.progreso.respondidas} de ${data.progreso.total} preguntas`;
    }

    setBusy(false);
    inputEl.focus();
  } catch (err) {
    if (esInicio && intento < 3) {
      setTimeout(() => callChat(mensaje, intento + 1), 4000);
      return;
    }
    hideTyping();
    showError("No pudimos conectar con el servidor. Revisá tu conexión e intentá de nuevo.");
    setBusy(false);
  }
}

function mostrarPasoTelefono() {
  inputRow.style.display = "none";
  progressWrap.style.display = "none";
  phoneStep.style.display = "flex";
  phoneInput.focus();
}

function completarLeadYMostrarResultado(telefono) {
  // El cliente ve su resultado YA, sin depender de que el guardado en Sheets
  // ni el mail salgan bien — eso pasa en segundo plano. Antes esta función
  // esperaba (con reintentos) a que /completar-lead respondiera para recién
  // ahí mostrar el resultado: si esa llamada se colgaba (ej: el envío de
  // mail por SMTP tardando o fallando en conectar), el cliente se quedaba
  // con la pantalla trabada sin ver nada, aunque el diagnóstico ya estaba
  // listo del lado del cliente hacía rato.
  phoneStep.style.display = "none";
  finalizarEntrevista(resultadoPendiente);
  completarLeadEnSegundoPlano(telefono);
}

async function completarLeadEnSegundoPlano(telefono) {
  for (let intento = 1; intento <= 3; intento++) {
    try {
      const resp = await fetch(COMPLETAR_LEAD_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, telefono: telefono || "" }),
      });
      if (resp.ok) return;
      console.warn(`completar-lead: intento ${intento} respondió ${resp.status}`);
    } catch (err) {
      console.warn(`completar-lead: intento ${intento} falló:`, err);
    }
    if (intento < 3) await new Promise(r => setTimeout(r, 3000));
  }
  console.error("completar-lead: se agotaron los 3 intentos sin éxito.");
}

phoneSubmit.addEventListener("click", () => {
  completarLeadYMostrarResultado(phoneInput.value.trim());
});
phoneSkip.addEventListener("click", () => {
  completarLeadYMostrarResultado("");
});
phoneInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") phoneSubmit.click();
});

function finalizarEntrevista(resultado) {
  inputRow.style.display = "none";
  progressWrap.style.display = "none";

  resultEl.style.display = "flex";
  resultEl.innerHTML = "";

  // Cuellos de botella
  const bottlenecksCard = document.createElement("div");
  bottlenecksCard.className = "result-card";
  let bottlenecksHtml = "<h2>Principales cuellos de botella</h2>";
  resultado.cuellos_de_botella.forEach(cb => {
    bottlenecksHtml += `
      <div class="bottleneck">
        <div class="icon">${cb.icono}</div>
        <div>
          <div class="label">${cb.categoria} — ${Math.round(cb.pct * 100)}% eficiencia</div>
          <div class="text">${cb.texto}</div>
        </div>
      </div>`;
  });
  bottlenecksCard.innerHTML = bottlenecksHtml;
  resultEl.appendChild(bottlenecksCard);

  // Pack recomendado
  const pack = resultado.pack;
  const packCard = document.createElement("div");
  packCard.className = "pack-card";
  packCard.innerHTML = `
    <div class="tag">Recomendado para vos</div>
    <h2>${pack.emoji} ${pack.nombre}</h2>
    <p>${resultado.texto_recomendacion.replace(/\n/g, "<br><br>")}</p>
  `;
  resultEl.appendChild(packCard);

  // CTA
  const ctaRow = document.createElement("div");
  ctaRow.className = "cta-row";
  ctaRow.innerHTML = `
    <a class="cta-btn primary" href="index.html#contacto">Quiero avanzar con este pack</a>
    <a class="cta-btn secondary" href="index.html">Volver al sitio</a>
  `;
  resultEl.appendChild(ctaRow);
}

sendBtn.addEventListener("click", () => {
  const val = inputEl.value.trim();
  if (!val) return;
  addMessage(val, "user");
  inputEl.value = "";
  callChat(val);
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendBtn.click();
});

function validarEmail(email) {
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
}

leadForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const nombre = leadNombre.value.trim();
  const email = leadEmail.value.trim();

  leadError.style.display = "none";
  if (!nombre) {
    leadError.textContent = "Contanos tu nombre para arrancar.";
    leadError.style.display = "block";
    return;
  }
  if (!validarEmail(email)) {
    leadError.textContent = "Ese mail no parece válido.";
    leadError.style.display = "block";
    return;
  }

  leadSubmit.disabled = true;
  leadSubmit.textContent = "Arrancando...";

  leadForm.style.display = "none";
  chatCard.style.display = "flex";

  datosContacto = { nombre, email };
  callChat(null);
});

// Arranque: se espera a que complete nombre + mail en el formulario inicial
// (ver leadForm submit arriba) antes de llamar a callChat() por primera vez.
</script>
</body>
</html>
